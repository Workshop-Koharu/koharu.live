# Netlify deployment configuration for ! Koharu.
# Netlify serves the Vite static site only; the Express/tRPC blog API needs full-stack hosting.
[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Single Page App routing: fallback to /index.html with status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
