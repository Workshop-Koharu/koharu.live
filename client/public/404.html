<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>! Koharu — Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages & Static Hosts
      // Preserves path, query, and hash across reloads and shared links
      (function () {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        var redirectUrl =
          l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash;

        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 40px; color: #666;">
      <p>페이지를 불러오는 중입니다... 🌸</p>
    </div>
  </body>
</html>
